<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
/* === Global Reset & Vibe === */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  /* Using a softer dark blue/gray instead of harsh #000 */
  background: #15202b; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Microsoft YaHei", "Meiryo", sans-serif;
  color: #ffffff;
  -webkit-font-smoothing: antialiased;
  padding: 20px;
}

/* === Main Tweet Card === */
.tweet-card {
  width: 600px;
  background: #1e2732; /* Slightly lighter than body for contrast */
  border: 1px solid #38444d;
  border-radius: 24px; /* Sleeker, rounder corners */
  padding: 20px;
  margin: 8px auto;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); /* Soft drop shadow */
}

/* === Header === */
.tweet-header {
  display: flex;
  align-items: center; /* Center vertically */
  margin-bottom: 12px;
}
.tweet-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: #38444d;
  flex-shrink: 0;
  margin-right: 14px;
  overflow: hidden;
  border: 2px solid #15202b; /* Subtle inner ring */
}
.tweet-avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.tweet-user {
  flex: 1;
  min-width: 0;
}
.tweet-name {
  font-size: 16px; font-weight: 800;
  color: #ffffff;
  line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tweet-handle {
  font-size: 14px; color: #8b98a5;
  margin-top: 2px;
}
.tweet-handle .time {
  color: #8b98a5;
}
.tweet-handle .time::before { content: "\00b7"; margin: 0 6px; }

/* === Body Content === */
.tweet-body {
  /* Removed the extreme left padding so text aligns under the avatar naturally */
  padding-left: 0; 
  margin-top: 8px;
}
.tweet-text {
  font-size: 16px; line-height: 1.5;
  color: #ffffff;
  margin-bottom: 12px;
  white-space: pre-wrap; word-wrap: break-word;
}

/* === Translation Section === */
.tweet-translation {
  font-size: 15px; line-height: 1.5;
  color: #8b98a5;
  margin-bottom: 12px;
  padding: 12px 16px;
  background: #15202b;
  border-left: 4px solid #1d9bf0; /* Cool accent line */
  border-radius: 0 12px 12px 0;
  white-space: pre-wrap; word-wrap: break-word;
}
.tweet-translation::before {
  content: "KABUBU翻译";
  display: block;
  font-size: 12px; font-weight: 700; color: #1d9bf0;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* === Media === */
.tweet-media {
  margin: 12px 0;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #38444d;
}
.tweet-media img, .tweet-media video {
  width: 100%; display: block;
}
.tweet-media-grid { display: grid; gap: 2px; }
.tweet-media-grid.cols-1 { grid-template-columns: 1fr; }
.tweet-media-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid.cols-3 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid.cols-3 img:first-child { grid-column: 1 / -1; }
.tweet-media-grid.cols-4 { grid-template-columns: 1fr 1fr; }
.tweet-media-grid img {
  width: 100%; height: 100%; object-fit: cover;
  aspect-ratio: 16/9;
}

/* === Quote Tweets === */
.quote-card {
  border: 1px solid #38444d;
  background: #15202b; /* Inset background */
  border-radius: 16px;
  padding: 16px;
  margin-top: 12px;
  transition: background 0.2s ease;
}
.quote-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.quote-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: #38444d; overflow: hidden;
}
.quote-avatar img { width: 100%; height: 100%; object-fit: cover; }
.quote-name {
  font-size: 14px; font-weight: 700; color: #ffffff;
}
.quote-handle {
  font-size: 14px; color: #8b98a5;
}
.quote-text {
  font-size: 14px; line-height: 1.4; color: #ffffff;
  white-space: pre-wrap; word-wrap: break-word;
}
.quote-media {
  margin-top: 12px; border-radius: 12px; overflow: hidden;
  border: 1px solid #38444d;
}
.quote-media img { width: 100%; display: block; }

/* === Stats & Footer === */
.tweet-stats {
  display: flex; justify-content: space-around;
  padding: 16px 0 8px;
  border-top: 1px solid #38444d;
  margin-top: 16px;
  font-size: 14px; color: #8b98a5;
}
.tweet-stats span { 
  display: flex; align-items: center; gap: 6px;
}
.tweet-stats strong { color: #ffffff; font-weight: 700; }

.tweet-footer {
  font-size: 14px; color: #8b98a5;
  padding-top: 12px;
  text-align: center;
}
.tweet-footer a {
  color: #1d9bf0; text-decoration: none; font-weight: 600;
}

/* === Thread Connections (The Glow-up) === */
.thread-arrow {
  text-align: center;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  color: #8b98a5;
  background: #1e2732;
  border: 1px solid #38444d;
  padding: 6px 16px;
  border-radius: 20px; /* Pill shape */
  margin: -4px auto;
  width: fit-content;
  position: relative;
  z-index: 10;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  letter-spacing: 0.5px;
}

/* === Live Notifications === */
.live-alert {
  width: 600px;
  background: linear-gradient(135deg, #2b1120, #16111e); /* Moody gradient */
  border: 1px solid #f91880;
  border-radius: 24px;
  padding: 24px;
  margin: 16px auto;
  text-align: center;
  box-shadow: 0 0 30px rgba(249, 24, 128, 0.15); /* Neon pink glow */
}
.live-icon {
  font-size: 48px; margin-bottom: 12px;
  filter: drop-shadow(0 0 10px rgba(249,24,128,0.5));
}
.live-title {
  font-size: 22px; font-weight: 800; color: #ffffff;
  margin-bottom: 8px;
}
.live-members {
  font-size: 16px; color: #1d9bf0; font-weight: 600;
  margin-bottom: 12px;
}
.live-time {
  display: inline-block;
  background: rgba(249, 24, 128, 0.2);
  padding: 6px 16px; border-radius: 12px;
  font-size: 16px; color: #f91880; font-weight: 700;
  margin-bottom: 8px;
}
.live-note {
  font-size: 14px; color: #8b98a5; margin-top: 8px;
}

/* Container */
.card-container {
  display: flex; flex-direction: column;
  align-items: center; padding: 20px 0;
}
.card-label {
  font-size: 13px; font-weight: 600; color: #8b98a5;
  text-transform: uppercase; letter-spacing: 1px;
  padding: 0 0 12px 0; text-align: center; width: 600px;
}
</style>
</head>
<body>
<div class="card-container">
{% block content %}{% endblock %}
</div>
</body>
</html>
